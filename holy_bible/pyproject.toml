[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "holy-bible"
version = "0.1.0"
description = "Scraper e indexación RAG de la Biblia Torres Amat (canon católico)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "anthropic>=0.40",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
holy-bible-chunker = "holy_bible.etl.cli.chunker:main"
holy-bible-cargar-chroma = "holy_bible.etl.cli.cargar_chroma:main"
holy-bible-consultar = "holy_bible.rag.cli.consultar:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
